name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t test -p core server
      - run: npx nx run-many -t build -p server web cli --configuration=production
      - run: docker build -t tasks-server .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: native/macos/bundle.sh
      - run: cd native/macos/build && zip -qr TasksBar.zip TasksBar.app
      - uses: actions/upload-artifact@v4
        with:
          name: TasksBar-macos
          path: native/macos/build/TasksBar.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish native/windows/TasksTray -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TasksTray-windows
          path: publish/TasksTray.exe

  # A pushed version tag publishes the apps: Actions artifacts can only be downloaded when signed in
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then text=(--notes-file "$notes"); else text=(--generate-notes); fi
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tasks ${GITHUB_REF_NAME#v}" "${text[@]}"
          gh release upload "$GITHUB_REF_NAME" TasksBar-macos/TasksBar.zip TasksTray-windows/TasksTray.exe --clobber
