# Setup: see DEPLOY.md. In short: cp .env.example .env (set TASKS_TOKEN), mkdir data, sh scripts/deploy.sh
services:
  tasks:
    build: .
    image: tasks-server
    restart: unless-stopped
    env_file: .env
    # Runs as the host user that owns the data folder, so the Markdown files stay yours to read, copy and back up
    user: "${TASKS_UID:-1000}:${TASKS_GID:-1000}"
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - "${DATA_PATH:-./data}:/data"
