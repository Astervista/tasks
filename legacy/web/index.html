<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script type="text/javascript"
            src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <script src="index.js"></script>
    <link href="index.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
<div id="address-bar" style="display:none;">
    <label for="address">Path: </label>
    <input type="text" id="address" autocomplete="off">
    <span id="address-space"><span class="subTodo selected" style="transform: translateY(2px)">ToDo</span> </span>
    <span id="address-close" class="material-icons">cancel</span>
</div>
<div id="suggestion-bar" style="display:none;">

</div>
<div id="header" class="task-line header" style="display:none;">
    <span class="task-line-name">Title</span>
    <span class="task-line-creation">Creation date</span>
    <span class="task-line-running">Open since</span>
    <span class="task-line-completion">Completion date</span>
    <span class="task-line-weight">Weight</span>
    <span class="task-line-counter">Time spent</span>
    <span class="task-line-status">Status</span>
</div>
<div id="tasks" style="display:none;"></div>
<div id="status-bar" style="display:none;">
    <span id="status-left-ext"></span>
    <span id="status-left-int"></span>
    <span id="status-add" style="background-color: #8b65fd " class="button">Add TODO</span>
    <span id="status-right-int"></span>
    <span id="status-right-ext"></span>
</div>
<div id="effects"></div>
<div id="loading">
    <svg height="24px" viewBox="0 0 24 24" width="24px" id="hourglass">
        <defs>
            <clipPath id="hourglass-shape">
                <path d="M8 2c-1.1 0-2 .9-2 2v3.17c0 .53.21 1.04.59 1.42L10 12l-3.42 3.42c-.37.38-.58.89-.58 1.42V20c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-3.16c0-.53-.21-1.04-.58-1.41L14 12l3.41-3.4c.38-.38.59-.89.59-1.42V4c0-1.1-.9-2-2-2H8z"/>
            </clipPath>
        </defs>
        <rect x="0" width="24" fill="gold" clip-path="url(#hourglass-shape)" id="hourglass-sand-up"></rect>
        <rect x="0" width="24" fill="gold" clip-path="url(#hourglass-shape)" id="hourglass-sand-down"></rect>
        <path fill="white"
              d="M8 2c-1.1 0-2 .9-2 2v3.17c0 .53.21 1.04.59 1.42L10 12l-3.42 3.42c-.37.38-.58.89-.58 1.42V20c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-3.16c0-.53-.21-1.04-.58-1.41L14 12l3.41-3.4c.38-.38.59-.89.59-1.42V4c0-1.1-.9-2-2-2H8zm8 14.5V19c0 .55-.45 1-1 1H9c-.55 0-1-.45-1-1v-2.5l4-4 4 4zm-4-5l-4-4V5c0-.55.45-1 1-1h6c.55 0 1 .45 1 1v2.5l-4 4z"/>
    </svg>
</div>
<div id="error" style="font-size: 33px">
    <svg  height="312px" viewBox="0 0 24 24" width="24px" id="triangle-error">
        <path fill="crimson"  id="triangle-error-triangle" d="M4.47 21h15.06c1.54 0 2.5-1.67 1.73-3L13.73 4.99c-.77-1.33-2.69-1.33-3.46 0L2.74 18c-.77 1.33.19 3 1.73 3z"/>
        <path fill="white" id="triangle-error-path" d="M12 14c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1s1 .45 1 1v2c0 .55-.45 1-1 1zm1 4h-2v-2h2v2z"/>
    </svg>
    <span>Error connecting. </span>
    <span><span style="cursor: pointer; color: #ff3c63" onclick="socketError -= 5; createSocket()">Click here</span> to retry</span>
</div>
</body>
</html>
